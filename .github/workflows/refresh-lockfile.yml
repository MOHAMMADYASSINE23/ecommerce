name: Temporary dependency lockfile refresh

on:
  push:
    branches: [security/stripe-checkout-hardening]
    paths:
      - "package.json"
      - ".github/workflows/refresh-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: temporary-lockfile-refresh
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: synchronize Sanity dependency lockfile"
          git push
