name: Temporary compatible dependency refresh

on:
  push:
    branches: [security/stripe-checkout-hardening]
    paths:
      - "package.json"
      - ".github/workflows/refresh-lockfile.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply compatible dependency security fixes
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Commit updated manifests if changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No compatible dependency updates were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: apply compatible dependency audit fixes"
          git push
