name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Audit, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: qp5316nb
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_API_READ_TOKEN: ci-placeholder-read-only-token
      SANITY_API_WRITE_TOKEN: ci-placeholder-write-token
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      SITE_URL: http://localhost:3000
      STRIPE_SHIPPING_RATE_ID: shr_test_placeholder
      STRIPE_ALLOWED_SHIPPING_COUNTRIES: US,CA
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Report full dependency audit
        run: |
          timeout 90s npm audit --json > npm-audit.json || true
          if ! node -e 'JSON.parse(require("fs").readFileSync("npm-audit.json", "utf8"))' 2>/dev/null; then
            echo '{"error":"npm audit did not return valid JSON (possible timeout)"}' > npm-audit.json
          fi
          node -e 'const a = require("./npm-audit.json"); console.log("Full dependency audit:", JSON.stringify(a.metadata?.vulnerabilities || a.error || {}, null, 2)); console.log("Findings:", JSON.stringify(Object.entries(a.vulnerabilities || {}).map(([name, v]) => ({name, severity: v.severity, isDirect: v.isDirect, range: v.range, fixAvailable: v.fixAvailable})), null, 2))'
      - name: Block critical production dependency vulnerabilities
        run: |
          timeout 90s npm audit --omit=dev --json > npm-audit-production.json || true
          if ! node -e 'JSON.parse(require("fs").readFileSync("npm-audit-production.json", "utf8"))' 2>/dev/null; then
            echo '{"error":"production npm audit did not return valid JSON (possible timeout)"}' > npm-audit-production.json
          fi
          node -e 'const a = require("./npm-audit-production.json"); const v = a.metadata?.vulnerabilities; console.log("Production dependency audit:", JSON.stringify(v || a.error || {}, null, 2)); if (!v || v.critical > 0) process.exit(1); if (v.high > 0 || v.moderate > 0) console.warn("Non-critical production dependency findings remain and require follow-up.")'
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
