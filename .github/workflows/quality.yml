name: Quality Checks

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/quality.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/workflows/quality.yml"

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Audit, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: qp5316nb
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
      SANITY_API_READ_TOKEN: ci-placeholder-read-only-token
      STRIPE_SECRET_KEY: sk_test_placeholder
      SITE_URL: http://localhost:3000
      STRIPE_SHIPPING_RATE_ID: shr_test_placeholder
      STRIPE_ALLOWED_SHIPPING_COUNTRIES: US,CA
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Temporary compatible lockfile refresh
        if: github.event_name == 'pull_request'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "security: refresh Sanity dependency lockfile"
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Report full dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a = require("./npm-audit.json"); console.log("Full dependency audit:", JSON.stringify(a.metadata?.vulnerabilities || a.error || {}, null, 2)); console.log("Findings:", JSON.stringify(Object.entries(a.vulnerabilities || {}).map(([name, v]) => ({name, severity: v.severity, isDirect: v.isDirect, range: v.range, fixAvailable: v.fixAvailable})), null, 2))'
      - name: Enforce production dependency audit
        run: |
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e 'const a = require("./npm-audit-production.json"); const v = a.metadata?.vulnerabilities; console.log("Production dependency audit:", JSON.stringify(v || a.error || {}, null, 2)); if (!v || v.total > 0) process.exit(1)'
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
