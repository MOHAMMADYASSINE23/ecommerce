name: Temporary ecommerce lock refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the ecommerce security branch
        uses: actions/checkout@v4
        with:
          ref: security/stripe-and-sanity-hardening
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Resolve compatible dependency updates
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Commit lockfile to the security branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh ecommerce dependency lockfile"
          git push origin HEAD:security/stripe-and-sanity-hardening
